# Scheduled refresh of the weather index.
#
# Every 30 minutes rather than daily, because alerts are the perishable half of
# this corpus: a Flash Flood Warning is issued, amended, and expires inside a
# few hours. A daily refresh would leave the index mostly answering questions
# about weather that has already happened.
#
# The deployed job runs every 30 minutes and is UNPAUSED - it was run by hand
# first, confirmed green, and only then put on the timer. An unattended job
# that has never succeeded is just a scheduled way to fail.
#
# This bundle definition keeps pause_status: PAUSED so that deploying it into a
# fresh workspace does not start firing before anyone has verified it there.

resources:
  jobs:
    refresh_weather_index:
      name: "SkyIndex-AI - refresh weather index"
      description: >-
        Harvests active NWS alerts and gridpoint forecasts into weather_documents,
        then embeds any document that is new or whose text has been amended.

      # A notebook task, not spark_python_task, and the reason is specific:
      # installing psycopg2-binary into a kernel that has already loaded a
      # different build of the same native extension aborts the process with
      # SIGABRT on `import psycopg2` - a crash, not an exception. The fix is to
      # restart the interpreter after installing, and only a notebook can do
      # that mid-run. The notebook installs its own dependencies, so no
      # environment spec is needed here.
      tasks:
        - task_key: refresh
          notebook_task:
            notebook_path: ../notebooks/refresh_weather_index_job.py
            base_parameters:
              user_agent: "(SkyIndex-AI, lubobali23@gmail.com)"
              locations: "Chicago, IL;Austin, TX;Denver, CO;Miami, FL;Seattle, WA"
              limit: "50"

      schedule:
        # Every 30 minutes.
        quartz_cron_expression: "0 0,30 * * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - lubobali23@gmail.com

      # A refresh that overruns its own interval means something is wrong
      # upstream; queueing another on top of it would compound the problem.
      max_concurrent_runs: 1
      timeout_seconds: 1800
